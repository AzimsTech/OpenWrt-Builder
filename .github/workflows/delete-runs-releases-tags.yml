name: Delete older releases, tags and workflow runs 
on:
  schedule:
    - cron: '0 0 * * 0'
    # Run every week at 12:00 AM.
  workflow_dispatch:

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Delete releases and tags (keep 3 latest per device model)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 1000 --json tagName,createdAt --order desc --sort created_at)

          echo "$releases" | jq -r '
            group_by(.tagName | sub("^[^-]+-"; "")) |
            .[] |
            sort_by(.createdAt) | reverse |
            .[3:] |
            .[].tagName
          ' | while read tag; do
            echo "Deleting release and tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3
